    args: null
    
  - name: "SimpleDetector43_input"
    class_path: "src.detectors.simple_detector.SimpleDetector"
    args: null

  - name: "SimpleDetector3_input"
    class_path: "src.detectors.simple_detector.SimpleDetector"
    args: null

internal_detectors: 
  - name: "SimpleInternalDetector1"
    class_path: "src.detectors.internal.linear_probe_detector.LinearProbeDetector"
    args: 
      model_path: "src/models/linear_probe/model_linear.pt"
      device: "cuda"
      target_layer_name: model.layers.27.mlp.act_fn
      threshold: 0.53

